function init(){const cs=[&#x27;All&#x27;,&#x27;Africa&#x27;,&#x27;Asia&#x27;,&#x27;Europe&#x27;,&#x27;North America&#x27;,&#x27;South America&#x27;,&#x27;Oceania&#x27;];$(&#x27;continents&#x27;).innerHTML=cs.map(c=&gt;`&lt;button class=&quot;chip ${c===&#x27;All&#x27;?&#x27;on&#x27;:&#x27;&#x27;}&quot; data-continent=&quot;${c}&quot;&gt;${c}&lt;/button&gt;`).join(&#x27;&#x27;);document.querySelectorAll(&#x27;[data-continent]&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{continent=b.dataset.continent;document.querySelectorAll(&#x27;[data-continent]&#x27;).forEach(n=&gt;n.classList.toggle(&#x27;on&#x27;,n===b));const centers={&#x27;All&#x27;:[0,0],&#x27;Africa&#x27;:[18,4],&#x27;Asia&#x27;:[85,34],&#x27;Europe&#x27;:[17,49],&#x27;North America&#x27;:[-103,40],&#x27;South America&#x27;:[-62,-17],&#x27;Oceania&#x27;:[145,-20]};[centerX,centerY]=xy(...centers[continent]);zoom=continent===&#x27;All&#x27;?1:2.1;applyZoom();render()}));document.querySelectorAll(&#x27;[data-mode]&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{mode=b.dataset.mode;document.querySelectorAll(&#x27;[data-mode]&#x27;).forEach(n=&gt;n.classList.toggle(&#x27;on&#x27;,n===b));render()}));$(&#x27;year&#x27;).addEventListener(&#x27;input&#x27;,e=&gt;{year=+e.target.value;render()});$(&#x27;search&#x27;).addEventListener(&#x27;input&#x27;,render);$(&#x27;coverage&#x27;).onclick=()=&gt;{showAreas=!showAreas;$(&#x27;coverage&#x27;).textContent=showAreas?&#x27;Areas&#x27;:&#x27;Dots&#x27;;$(&#x27;coverage&#x27;).classList.toggle(&#x27;on&#x27;,showAreas);render()};$(&#x27;zin&#x27;).onclick=()=&gt;setZoom(zoom*1.35);$(&#x27;zout&#x27;).onclick=()=&gt;setZoom(zoom/1.35);$(&#x27;reset&#x27;).onclick=()=&gt;{zoom=1;centerX=600;centerY=305;applyZoom()};$(&#x27;legend&#x27;).innerHTML=Object.entries(COLORS).map(([c,col])=&gt;`&lt;span style=&quot;--dot:${col}&quot;&gt;${c}&lt;/span&gt;`).join(&#x27;&#x27;);render()};init();

<script>
(function(){const tabs=[document.getElementById('timeline-tab'),document.getElementById('map-tab')];const panels=[document.getElementById('timeline-panel'),document.getElementById('map-panel')];function show(i,focus){tabs.forEach((t,n)=>{t.setAttribute('aria-selected',String(n===i));t.tabIndex=n===i?0:-1;panels[n].hidden=n!==i});if(focus)tabs[i].focus();if(location.hash!==(i?'#map':'#timeline'))history.replaceState(null,'',i?'#map':'#timeline')}
